name: collect
# 이슈 레이더 v2 — 0단계: 10분마다 신호원을 읽어 data/ 에 기록(읽기 전용, 글 작성·발행 없음)
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node collect.mjs
      - name: 기록 저장
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "snap $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break || sleep 5; done
